name: Build test APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build (defaults to master)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Determine release info
        id: info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SAFE_REF=$(echo "${{ inputs.ref || 'master' }}" | tr '/' '-')
            echo "tag=test-${SAFE_REF}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Test build: ${SAFE_REF} (#${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest-master" >> "$GITHUB_OUTPUT"
            echo "name=Latest master build" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.name }}
          prerelease: ${{ steps.info.outputs.prerelease }}
          make_latest: ${{ steps.info.outputs.make_latest }}
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Automated debug build for testing on a device. Unsigned/debug-signed only —
            not for distribution outside invited collaborators.

            Commit: ${{ github.sha }}
