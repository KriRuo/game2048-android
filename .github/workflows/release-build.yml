name: Build signed release bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build (defaults to master)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # See "Play Store rollout" in CLAUDE.md -- the first .aab upload to Play Console has to be
      # manual (a Google requirement, not a tooling gap), and there's no app in Play Console yet
      # for a service account to target. Until PLAY_SERVICE_ACCOUNT_JSON exists as a repo secret,
      # this whole env evaluates false and the upload step below is a clean no-op -- checked via
      # this env var rather than the secret directly in `if:`, which is more reliable in Actions.
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/game2048-release.jks

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=game2048-release.jks
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release bundle
        run: ./gradlew bundleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Clean up signing material
        if: always()
        run: rm -f app/game2048-release.jks keystore.properties

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      # Dormant until PLAY_SERVICE_ACCOUNT_JSON exists (see the env block above) -- once an app
      # exists in Play Console and a service-account key is added as that secret, this starts
      # publishing every signed bundle straight to the internal testing track with no other
      # change needed here.
      - name: Upload to Play Store (internal track)
        if: env.HAS_PLAY_CREDENTIALS == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kriruo.game2048
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
